<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>استوديو الموشن · nouraldeentofi.com</title>
<meta name="description" content="استوديو الموشن: اعمل فيديوهات موشن من 318 قالب جاهز، مجاناً وبالمتصفح.">
<meta name="theme-color" content="#0b0e12">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="استوديو الموشن · Nour Motion Studio">
<meta property="og:description" content="اعمل فيديوهات موشن من قوالب جاهزة، مجاناً وبالمتصفح.">
<meta property="og:image" content="https://studio.nouraldeentofi.com/icons/icon-512.png">
<meta property="og:url" content="https://studio.nouraldeentofi.com/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300..800&display=swap">
<link rel="stylesheet" href="css/app.css">
<script>try { var u = localStorage.getItem('nms:ui'); if (u === 'light' || (!u && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.ui = 'light'; } catch (e) {}</script>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="icons/icon.svg" width="36" height="36" alt="">
      <div class="brand-text"><strong>استوديو الموشن</strong><span>// motion studio</span></div>
    </div>
    <div class="top-mid">
      <div class="seg" id="aspectSeg" role="radiogroup" aria-label="مقاس الفيديو"></div>
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="helpBtn" title="كيف بشتغل؟" aria-label="مساعدة"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg></button>
      <button class="icon-btn" id="uiThemeBtn" title="وضع ليلي / نهاري" aria-label="تبديل وضع الموقع"><svg viewBox="0 0 24 24" class="i-moon"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
      <button class="icon-btn" id="undoBtn" title="تراجع (Ctrl+Z)" aria-label="تراجع"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
      <button class="icon-btn" id="redoBtn" title="إعادة (Ctrl+Y)" aria-label="إعادة"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
      <div class="menu-wrap">
        <button class="btn ghost" id="projectBtn" aria-haspopup="true"><svg viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span class="lbl">المشروع</span></button>
        <div class="menu" id="projectMenu" hidden></div>
      </div>
      <button class="btn" id="posterBtn" title="حفظ مشهد كصورة"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></svg><span class="lbl">بوستر</span></button>
      <button class="btn primary" id="exportBtn"><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span>تصدير MP4</span></button>
    </div>
  </header>

  <aside class="panel side" id="sidePanel">
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="templates" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>القوالب</button>
      <button role="tab" data-tab="elements"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>عناصر</button>
      <button role="tab" data-tab="backgrounds"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/></svg>خلفيات</button>
      <button role="tab" data-tab="style"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r="1.5"/><circle cx="17.5" cy="10.5" r="1.5"/><circle cx="8.5" cy="7.5" r="1.5"/><circle cx="6.5" cy="12.5" r="1.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.93 0 1.5-.75 1.5-1.66 0-.44-.18-.84-.44-1.13-.29-.29-.44-.65-.44-1.13a1.64 1.64 0 0 1 1.67-1.67h2c3.05 0 5.55-2.5 5.55-5.55C21.97 6.01 17.46 2 12 2z"/></svg>الستايل</button>
    </nav>
    <div class="tab-body" id="tab-templates"></div>
    <div class="tab-body" id="tab-elements" hidden></div>
    <div class="tab-body" id="tab-backgrounds" hidden></div>
    <div class="tab-body" id="tab-style" hidden></div>
  </aside>

  <main class="stage-wrap">
    <div class="stage" id="stage">
      <div class="stage-inner" id="stageInner">
        <canvas id="view"></canvas>
        <div class="overlay" id="overlay"></div>
      </div>
    </div>
    <div class="transport">
      <button class="play" id="playBtn" aria-label="تشغيل"><svg viewBox="0 0 24 24" class="i-play"><path d="M7 4l13 8-13 8V4z"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></svg></button>
      <span class="time mono" id="timeLabel">0:00.0 / 0:00.0</span>
      <input type="range" id="scrub" class="scrub" min="0" max="1000" value="0" step="1" aria-label="الوقت">
      <button class="chip-btn" id="loopBtn" title="تكرار المشهد الحالي فقط"><svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>المشهد فقط</button>
      <button class="chip-btn on" id="soundBtn" title="سماع الأصوات أثناء المعاينة"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>صوت</button>
    </div>
  </main>

  <aside class="panel inspector" id="inspector"></aside>

  <section class="timeline" id="timeline"></section>
</div>

<div id="modalRoot"></div>
<input type="file" id="fileInput" accept="image/*" hidden>
<input type="file" id="audioInput" accept="audio/*" hidden>
<input type="file" id="projectInput" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
