<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#111}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { renderFrame, renderScene, createEnv, ASPECTS } from '../js/engine/renderer.js';
import { loadFonts } from '../js/engine/fonts.js';
import { resolveTheme } from '../js/engine/themes.js';
window.errors = [];
window.addEventListener('error', e => window.errors.push(String(e.message)));
const c = document.getElementById('c');
// cells: [{project, t, label}]
window.grid = async (cells, cols = 4, cellW = 270) => {
  await loadFonts(['Figtree','IBM Plex Sans Arabic','JetBrains Mono', ...(window.extraFonts||[])]);
  await document.fonts.ready;
  const [W0,H0] = ASPECTS[cells[0].project.aspect||'4:5'];
  const cellH = Math.round(cellW * H0 / W0);
  const rows = Math.ceil(cells.length / cols);
  c.width = cols * cellW; c.height = rows * (cellH + 22);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,c.width,c.height);
  const tmp = document.createElement('canvas'); tmp.width = cellW; tmp.height = cellH;
  const tctx = tmp.getContext('2d');
  const times = [];
  for (let i = 0; i < cells.length; i++) {
    const cell = cells[i];
    const [W,H] = ASPECTS[cell.project.aspect||'4:5'];
    const env = createEnv(cell.project, W, H, cellW / W);
    env.onError = (el, e) => window.errors.push((cell.label||i) + ' ' + el.type + ': ' + e.message + ' ' + (e.stack||'').split('\n')[1]);
    const t0 = performance.now();
    try { renderFrame(tctx, cell.project, cell.t, env); } catch (e) { window.errors.push((cell.label||i) + ': ' + e.message + ' ' + (e.stack||'').split('\n')[1]); }
    times.push(performance.now() - t0);
    const x = (i % cols) * cellW, y = Math.floor(i / cols) * (cellH + 22);
    ctx.drawImage(tmp, x, y);
    ctx.fillStyle = '#ddd'; ctx.font = '13px sans-serif'; ctx.fillText(cell.label || String(i), x + 6, y + cellH + 15);
  }
  return times;
};
window.ready = true;
</script></body></html>
