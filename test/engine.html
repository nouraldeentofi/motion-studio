<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@300..900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300..800&display=swap">
<style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<canvas id="c"></canvas>
<script type="module">
import { renderFrame, createEnv, ASPECTS } from '../js/engine/renderer.js';
import { loadFonts } from '../js/engine/fonts.js';
window.errors = [];
window.addEventListener('error', e => window.errors.push(String(e.message)));
const c = document.getElementById('c');
window.setup = async (project, scale=0.5) => {
  await loadFonts(['Figtree','IBM Plex Sans Arabic','JetBrains Mono']);
  await document.fonts.ready;
  const [W,H] = ASPECTS[project.aspect||'4:5'];
  c.width = Math.round(W*scale); c.height = Math.round(H*scale);
  window.env = createEnv(project, W, H, scale);
  window.env.onError = (el, e) => window.errors.push(el.type + ': ' + e.message + ' ' + e.stack.split('\n')[1]);
  window.project = project;
};
window.renderAt = (t) => { const ctx = c.getContext('2d'); renderFrame(ctx, window.project, t, window.env); };
window.ready = true;
</script></body></html>
