# Nour Motion Studio: static site, served by Apache (used when nginx is not installed).
<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __ROOT__
    <Directory __ROOT__>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
    # the clone's .git and other dot files are never served
    RedirectMatch 404 /\.(?!well-known)
    AddType application/manifest+json .webmanifest
    <FilesMatch "\.(html|js|css|json|webmanifest)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
</VirtualHost>
