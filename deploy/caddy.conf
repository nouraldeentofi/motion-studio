# Nour Motion Studio: static site, served by Caddy (HTTPS is automatic).
# setup-vps.sh fills in __DOMAIN__ and __ROOT__ and appends this block to /etc/caddy/Caddyfile.
__DOMAIN__ {
	root * __ROOT__
	encode gzip

	# the clone's .git and other dot files are never served
	@hidden path /.*
	respond @hidden 404

	# HTML, JS and CSS change with every update: the browser re-checks them
	@fresh path / *.html *.js *.css *.json *.webmanifest
	header @fresh Cache-Control "no-cache"
	@static path *.png *.jpg *.jpeg *.svg *.ico *.woff *.woff2
	header @static Cache-Control "public, max-age=604800"
	header /manifest.webmanifest Content-Type "application/manifest+json"

	file_server
}
