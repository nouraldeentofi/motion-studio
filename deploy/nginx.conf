# Nour Motion Studio: static site, served by nginx.
# setup-vps.sh fills in __DOMAIN__ and __ROOT__; certbot adds the HTTPS part.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;

    # the clone's .git and other dot files are never served
    location ~ /\.(?!well-known) { deny all; return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML, JS and CSS change with every update: the browser re-checks them (a quick 304 when nothing changed)
    location ~* \.(?:html|js|css|json)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.(?:png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
}
